<svg xmlns="http://www.w3.org/2000/svg" width="480" height="365" viewBox="0 0 480 365" role="img" aria-label="Tecnologias utilizadas nos meus projetos">
<title>Tecnologias utilizadas nos meus projetos</title>
<defs>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4" stroke="#000" stroke-opacity=".15"/></pattern>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9dffb0" stroke-opacity=".025"/></pattern>
 <linearGradient id="sweep"><stop stop-color="#9dffb0" stop-opacity="0"/><stop offset=".5" stop-color="#9dffb0" stop-opacity=".6"/><stop offset="1" stop-color="#9dffb0" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
 .blink { animation: blink 1.5s steps(2, end) infinite; }
 .breathe { animation: breathe 4s ease-in-out infinite; }
 .flow { animation: flow 6s linear infinite; }
 .rain { animation: rain 13s linear infinite; }
 .reveal { animation: reveal 3s steps(28, end) 1 both; }
 @keyframes blink { 50% { opacity: .15; } }
 @keyframes breathe { 50% { opacity: .45; } }
 @keyframes flow { to { transform: translateX(480px); } }
 @keyframes rain { to { transform: translateY(280px); } }
 @keyframes reveal { from { opacity: .25; } to { opacity: 1; } }
</style>
<rect x=".5" y=".5" width="479" height="364" rx="9" fill="#090e0c" stroke="#24382e"/>
<rect x="1" y="1" width="478" height="363" rx="9" fill="url(#grid)"/>
<text x="24" y="31" font-size="14" fill="#d9bd84" >$ ls stack/</text><path d="M1 50H479" stroke="#24382e"/><text x="24" y="83" font-size="11" fill="#9dffb0" letter-spacing="1">FRONTEND</text><text x="24" y="106" font-size="13" fill="#e4f0e8" >React · Next.js · TypeScript · Vite</text><text x="24" y="138" font-size="11" fill="#9dffb0" letter-spacing="1">BACKEND</text><text x="24" y="161" font-size="13" fill="#e4f0e8" >Node.js · Python / Flask · Go</text><text x="24" y="193" font-size="11" fill="#9dffb0" letter-spacing="1">DADOS</text><text x="24" y="216" font-size="13" fill="#e4f0e8" >PostgreSQL · Supabase · SQLite · MongoDB</text><text x="24" y="248" font-size="11" fill="#9dffb0" letter-spacing="1">INFRA</text><text x="24" y="271" font-size="13" fill="#e4f0e8" >Docker · NGINX · Prometheus · Grafana</text><text x="24" y="303" font-size="11" fill="#9dffb0" letter-spacing="1">ENGENHARIA</text><text x="24" y="326" font-size="13" fill="#e4f0e8" >Vitest · Git · SOLID · RLS</text>
<rect x="1" y="1" width="478" height="363" rx="9" fill="url(#scan)" pointer-events="none"/>
<style>.blink,.breathe,.flow,.rain,.reveal { animation: none !important; }</style></svg>