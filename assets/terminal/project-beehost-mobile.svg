<svg xmlns="http://www.w3.org/2000/svg" width="480" height="273" viewBox="0 0 480 273" role="img" aria-label="BeeHost — Do checkout PIX ao servidor Minecraft. Vitrine, provisionamento e painel do cliente.">
<title>BeeHost — Do checkout PIX ao servidor Minecraft. Vitrine, provisionamento e painel do cliente.</title>
<defs>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4" stroke="#000" stroke-opacity=".15"/></pattern>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9dffb0" stroke-opacity=".025"/></pattern>
 <linearGradient id="sweep"><stop stop-color="#9dffb0" stop-opacity="0"/><stop offset=".5" stop-color="#9dffb0" stop-opacity=".6"/><stop offset="1" stop-color="#9dffb0" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
 .blink { animation: blink 1.5s steps(2, end) infinite; }
 .breathe { animation: breathe 4s ease-in-out infinite; }
 .flow { animation: flow 6s linear infinite; }
 .rain { animation: rain 13s linear infinite; }
 .reveal { animation: reveal 3s steps(28, end) 1 both; }
 .clover-drift { animation: clover-drift 4s ease-in-out infinite; }
 @keyframes blink { 50% { opacity: .15; } }
 @keyframes breathe { 50% { opacity: .45; } }
 @keyframes flow { to { transform: translateX(480px); } }
 @keyframes rain { to { transform: translateY(280px); } }
 @keyframes reveal { from { opacity: .25; } to { opacity: 1; } }
 @keyframes clover-drift { 50% { transform: translateY(-9px); } }
</style>
<rect x=".5" y=".5" width="479" height="272" rx="9" fill="#090e0c" stroke="#24382e"/>
<rect x="1" y="1" width="478" height="271" rx="9" fill="url(#grid)"/>
<text x="24" y="29" font-size="12" fill="#9dffb0" >[04] ~/beehost</text><text x="456" y="29" font-size="11" fill="#d9bd84" text-anchor="end">FULL STACK</text><path d="M1 46H479" stroke="#24382e"/><text x="24" y="92" font-size="25" fill="#e4f0e8" font-weight="700" letter-spacing="-.6">BeeHost</text><text x="24" y="129" font-size="15" fill="#e4f0e8" >Do checkout PIX ao servidor Minecraft.</text><text x="24" y="153" font-size="15" fill="#e4f0e8" >Vitrine, nuvem e painel do cliente.</text><text x="24" y="191" font-size="13" fill="#789184" >React · Node.js · Asaas · Daytona</text><path d="M24 213H456" stroke="#24382e"/><text x="24" y="245" font-size="10" fill="#789184" >CLOUD / GAMES</text><text x="456" y="245" font-size="13" fill="#9dffb0" text-anchor="end">EXPLORAR ↗</text><rect class="flow" x="-480" y="271" width="480" height="1" fill="url(#sweep)" style="animation-delay:-3.2s"/>
<rect x="1" y="1" width="478" height="271" rx="9" fill="url(#scan)" pointer-events="none"/>
