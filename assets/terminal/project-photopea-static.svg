<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="211" viewBox="0 0 1000 211" role="img" aria-label="Photopea AI Studio — Da seleção do canvas a uma nova camada. Edição com IA, prévia e ajustes de borda.">
<title>Photopea AI Studio — Da seleção do canvas a uma nova camada. Edição com IA, prévia e ajustes de borda.</title>
<defs>
 <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4" stroke="#000" stroke-opacity=".15"/></pattern>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9dffb0" stroke-opacity=".025"/></pattern>
 <linearGradient id="sweep"><stop stop-color="#9dffb0" stop-opacity="0"/><stop offset=".5" stop-color="#9dffb0" stop-opacity=".6"/><stop offset="1" stop-color="#9dffb0" stop-opacity="0"/></linearGradient>
</defs>
<style>
 text { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
 .blink { animation: blink 1.5s steps(2, end) infinite; }
 .breathe { animation: breathe 4s ease-in-out infinite; }
 .flow { animation: flow 6s linear infinite; }
 .rain { animation: rain 13s linear infinite; }
 .reveal { animation: reveal 3s steps(28, end) 1 both; }
 @keyframes blink { 50% { opacity: .15; } }
 @keyframes breathe { 50% { opacity: .45; } }
 @keyframes flow { to { transform: translateX(1000px); } }
 @keyframes rain { to { transform: translateY(280px); } }
 @keyframes reveal { from { opacity: .25; } to { opacity: 1; } }
</style>
<rect x=".5" y=".5" width="999" height="210" rx="9" fill="#090e0c" stroke="#24382e"/>
<rect x="1" y="1" width="998" height="209" rx="9" fill="url(#grid)"/>
<text x="32" y="29" font-size="12" fill="#9dffb0" >[03] ~/photopea</text><text x="968" y="29" font-size="11" fill="#d9bd84" text-anchor="end">EXPERIMENTAL</text><path d="M1 46H999" stroke="#24382e"/><text x="32" y="92" font-size="30" fill="#e4f0e8" font-weight="700" letter-spacing="-.6">Photopea AI Studio</text><text x="32" y="127" font-size="17" fill="#e4f0e8" >Da seleção do canvas a uma nova camada.</text><text x="32" y="153" font-size="17" fill="#e4f0e8" >Edição com IA, prévia e ajustes de borda.</text><text x="32" y="187" font-size="13" fill="#789184" >React · TypeScript · SDXL · Hugging Face</text><text x="962" y="135" font-size="64" fill="#24382e" text-anchor="end" font-weight="700">/03</text><text x="965" y="186" font-size="13" fill="#9dffb0" text-anchor="end">EXPLORAR ↗</text><rect class="flow" x="-1000" y="209" width="1000" height="1" fill="url(#sweep)" style="animation-delay:-2.4000000000000004s"/>
<rect x="1" y="1" width="998" height="209" rx="9" fill="url(#scan)" pointer-events="none"/>
<style>.blink,.breathe,.flow,.rain,.reveal { animation: none !important; }</style></svg>